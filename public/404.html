<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting&hellip;</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a hard refresh or
      // direct link to a client-side route (e.g. /resume/staff) 404s
      // here. Stash the real path and bounce to "/" -- main.tsx reads
      // it back and restores the route via history.replaceState.
      // See design/ARCHITECTURE.md ("Routing").
      sessionStorage.setItem("spa-redirect-path", location.pathname + location.search + location.hash);
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
